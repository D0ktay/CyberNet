; ═══════════════════════════════════════════════════════════════════════════════
; Wi-Fi CSI Radar — ESP32 Firmware
; PlatformIO Project Configuration
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial baud — CSI akışı için yüksek tutulmalı
monitor_speed = 921600
upload_speed  = 921600

; Seri port — Mac'te kendi portunu yaz (ls /dev/cu.* ile bul)
; upload_port = /dev/cu.usbserial-1410
; monitor_port = /dev/cu.usbserial-1410

; ESP-IDF bileşenleri — CSI API için gerekli
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ESP32_WIFI_CSI_ENABLED=1
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=10
    -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=32

; Gerekli kütüphaneler (PlatformIO Registry'den otomatik indirir)
lib_deps =

; Bellek optimizasyonu — CSI buffer için heap ayrımı
board_build.partitions = min_spiffs.csv
